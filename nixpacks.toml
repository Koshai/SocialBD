# Pin Node 22 (Node 24 breaks corepack/pnpm on Railway).
# Put pnpm on PATH explicitly — `npm i -g pnpm` alone is not on PATH in later layers.

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = [
  "npm install -g pnpm@11.1.2",
  "ln -sf \"$(npm prefix -g)/bin/pnpm\" /usr/local/bin/pnpm",
  "ln -sf \"$(npm prefix -g)/bin/pnpx\" /usr/local/bin/pnpx || true",
  "pnpm --version",
  "pnpm install --frozen-lockfile"
]

[variables]
NIXPACKS_NODE_VERSION = "22"
PATH = "/usr/local/bin:$PATH"
