# QueueOra — worker service (Railway)
# Settings → Config-as-code → path: railway.worker.toml

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @socialbd/worker build"

[deploy]
startCommand = "pnpm --filter @socialbd/worker start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
