# QueueOra — web service (Railway)
# Settings → Config-as-code → path: railway.web.toml

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @socialbd/web build"

[deploy]
startCommand = "pnpm --filter @socialbd/web start"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
